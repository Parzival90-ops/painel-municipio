<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Município — Selo UNICEF 2025-2028</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Painel do município (simplificado): seletor → ficha com legenda de 5 cores → atividades por área, cada uma com cor e prazo vigente */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f2f1ed; --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
  --accent: #82d1ef; --on-accent: #0b0b0b; --accent-2: #bfe7f7; --link: #1a5fb4;
  --s-garantida: #0ca30c; --s-alcancavel: #4a90e2; --s-depende: #d03b3b; --s-inviavel: #b58ee0; --s-critico: #f28b82; --s-risco: #fab219;
  /* as cinco cores das atividades */
  --c-verde: #0ca30c; --c-amarelo: #fab219; --c-vermelho: #d03b3b; --c-azul: #4a90e2; --c-azulclaro: #a9dcf7; --c-cinza: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --link: #8ab8f5; --c-cinza: #6b6a66; --c-azulclaro: #5fa8d3;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --link: #8ab8f5; --c-cinza: #6b6a66; --c-azulclaro: #5fa8d3;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--link); }
header { background: linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--on-accent); padding-block: 20px 16px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
header h1 { margin: 0; font-size: 22px; font-weight: 650; text-wrap: balance; }
header .sub { margin-top: 4px; font-size: 14px; opacity: .92; }
header .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
header .meta span, header nav a, .tema { background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.65); border-radius: 999px; padding: 3px 10px; }
header nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
header nav a { color: inherit; font-size: 12px; text-decoration: none; }
header nav a:hover, .tema:hover { background: rgba(255,255,255,.75); }
.tema { font: inherit; font-size: 12px; color: inherit; cursor: pointer; }
main { max-width: 1080px; margin: 0 auto; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.nota { margin: 6px 0 0; font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; max-width: 90ch; }
.seletor { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); min-width: 0; }
.campo select { font: inherit; font-size: 15px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 260px; max-width: 100%; }
@media (max-width: 480px) { .campo, .campo select { width: 100%; min-width: 0; } }
.botoes-uf { display: inline-flex; gap: 6px; }
.botoes-uf button { font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 10px; padding: 6px 14px; cursor: pointer; }
.botoes-uf button:hover { border-color: var(--accent); }
.botoes-uf button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.ficha-topo { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; }
.imprimir { font: inherit; font-size: 13.5px; font-weight: 600; margin-left: auto; cursor: pointer; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--accent); border-radius: 10px; padding: 6px 12px; }
.imprimir:hover { background: var(--surface-2); }
@media (max-width: 600px) { .imprimir { margin-left: 0; width: 100%; } }
.ficha-topo .nome { font-size: 24px; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px 2px 3px; background: var(--surface-1); white-space: nowrap; }
.ic { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0b0b0b; flex: none; }
/* legenda com contagem: uma caixa por cor */
.legenda { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
@media (max-width: 760px) { .legenda { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.leg { background: var(--surface-2); border-radius: 10px; padding: 9px 11px 9px 13px; border-left: 5px solid var(--cor); min-width: 0; }
.leg .n { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.leg .t { font-size: 12.5px; font-weight: 600; }
.leg .d { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
/* áreas */
details.area { border-bottom: 1px solid var(--grid); }
details.area:first-of-type { border-top: 1px solid var(--grid); }
details.area > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 11px 6px; }
details.area > summary::-webkit-details-marker { display: none; }
details.area > summary:hover, details.area[open] > summary { background: var(--surface-2); }
.seta { color: var(--muted); transition: transform .15s; display: inline-block; }
details[open] > summary .seta { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .seta { transition: none; } }
.a-nome { font-size: 14px; min-width: 0; }
.a-nome small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.faixa { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 3px; }
.faixa i { width: 14px; height: 14px; border-radius: 3px; background: var(--cor); display: inline-block; }
.a-corpo { padding: 2px 0 10px 22px; }
@media (max-width: 720px) { .a-corpo { padding-left: 0; } }
/* atividades */
details.ent { border-top: 1px solid var(--grid); }
details.ent > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 200px minmax(0, 1fr) 150px 14px; gap: 4px 12px; align-items: center; padding: 8px 4px 8px 0; border-left: 5px solid var(--cor); padding-left: 10px; }
details.ent > summary::-webkit-details-marker { display: none; }
details.ent > summary:hover { background: var(--surface-2); }
.st { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; min-width: 0; }
.st .ic { background: var(--cor); }
.nome-ent { font-size: 13.5px; line-height: 1.35; min-width: 0; }
.nome-ent .rot { display: block; font-size: 12px; color: var(--text-secondary); overflow-wrap: anywhere; }
.prazo { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; text-align: right; }
.prazo small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
@media (max-width: 720px) {
  details.ent > summary { grid-template-columns: minmax(0, 1fr) auto 14px; }
  details.ent > summary .nome-ent { grid-column: 1 / -1; grid-row: 2; }
}
.detalhe { padding: 4px 4px 14px 15px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px 24px; font-size: 13px; line-height: 1.5; }
@media (max-width: 720px) { .detalhe { grid-template-columns: 1fr; } }
.detalhe dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; }
.detalhe dt { color: var(--muted); font-size: 12px; }
.detalhe dd { margin: 0; overflow-wrap: anywhere; }
.detalhe h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); }
.mudancas { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.mudancas li { background: var(--surface-2); border-radius: 8px; padding: 7px 10px; }
.mudancas .de-para { font-variant-numeric: tabular-nums; font-weight: 600; }
.grupo-data { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 4px; font-size: 14px; font-weight: 650; }
.grupo-data .dias { font-size: 12px; font-weight: 500; color: var(--text-secondary); background: var(--surface-2); border-radius: 999px; padding: 1px 9px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; white-space: nowrap; background: var(--surface-2); border: 1px solid var(--border); }
footer { max-width: 1080px; margin: 0 auto; padding-block: 0 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1 id="titulo"></h1>
  <div class="sub" id="subtitulo"></div>
  <div class="meta" id="meta"></div>
  <nav id="navegacao"></nav>
</header>
<main>
  <section class="card" aria-label="Escolha do município">
    <div class="seletor">
      <div class="campo"><span>Estado</span><div class="botoes-uf" id="f-uf" role="group" aria-label="Estado"><button type="button" data-uf="MA" aria-pressed="true">Maranhão</button><button type="button" data-uf="PI" aria-pressed="false">Piauí</button></div></div>
      <label class="campo" for="f-mun"><span>Município</span><select id="f-mun"></select></label>
    </div>
  </section>

  <section class="card" id="ficha">
    <div class="ficha-topo"><span class="nome" id="m-nome"></span><span id="m-sit"></span><button type="button" class="imprimir" id="b-relatorio">🖨 Imprimir relatório do município</button></div>
    <div class="legenda" id="m-legenda"></div>
  </section>

  <section class="card">
    <h2 id="h-proximas" style="margin:0 0 4px;font-size:17px">Próximas janelas de entrega</h2>
    <p class="nota" id="n-proximas" style="margin:0 0 6px"></p>
    <div id="l-proximas"></div>
  </section>

  <section class="card">
    <div id="l-areas"></div>
    <p class="nota">Clique numa área para ver as atividades, em ordem de prazo, e numa atividade para ver o que o Guia pede, o registro do município, os dados do dia e o prazo.</p>
  </section>
</main>
<footer id="rodape"></footer>
<script type="application/json" id="dados"></script>
<script>
fetch("dados.json?t=" + Date.now(), { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then((t) => { document.getElementById("dados").textContent = t; const s = document.createElement("script"); s.src = "app.js?v=25223c5396"; document.body.append(s); })
  .catch((e) => { document.querySelector("main").innerHTML = '<section class="card"><p>Não foi possível carregar os dados do painel (' + e.message + '). Recarregue a página.</p></section>'; });
</script>
</body>
</html>
